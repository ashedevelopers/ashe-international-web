<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>.wt-d{animation:wt-f 2s ease-in infinite}.wt-r{transform-origin:32px 52px;animation:wt-p 2s ease-out infinite}@keyframes wt-f{0%{transform:translateY(-10px);opacity:0}30%{opacity:1}70%{transform:translateY(20px);opacity:1}100%{transform:translateY(20px);opacity:0}}@keyframes wt-p{0%,60%{transform:scale(.2);opacity:0}70%{opacity:1}100%{transform:scale(1);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wt-d" d="M32 8c7 10 10 15 10 20a10 10 0 0 1-20 0c0-5 3-10 10-20z" fill="#6FB3DA" stroke="#0F0F0F" stroke-width="2.5"/><ellipse class="wt-r" cx="32" cy="52" rx="22" ry="6" fill="none" stroke="#0F0F0F" stroke-width="3"/><path d="M8 54q6-4 12 0t12 0 12 0 12 0" stroke="#6FB3DA" stroke-width="3" fill="none"/></svg>
