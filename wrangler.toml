# Cloudflare Pages + Pages Functions configuration
name = "ashe-international-web"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
APP_URL = "https://asheinternational.org"
MAIL_FROM = "info@asheinternational.org"
PESAPAL_ENV = "live"
# Google Sheet "ASHE Website Leads & Pledges" (not a secret)
SHEET_ID = "1dJxqVoGKLtavyjaRMd1jcYs9BkpqDny6DM7ZJtXPro8"

# Secrets (set with `wrangler pages secret put NAME`, never commit):
#   JWT_SECRET (32+ chars), GOOGLE_SERVICE_ACCOUNT_JSON, PESAPAL_CONSUMER_KEY, PESAPAL_CONSUMER_SECRET, RESEND_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "ashe-db"
database_id = "963a8b69-bc6f-440b-a500-eac22423ad39"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "41c7a42ff772485d997bb140ea18c490"

# R2 storage for uploads (enable R2 in the dashboard first)
# Create:  wrangler r2 bucket create ashe-uploads
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "ashe-uploads"
